<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Overview{% endblock %} · Personal Finance Insights</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">Personal Finance <span>Insights</span></a>
  <nav>
    {% set p = request.url.path %}
    <a href="/" class="{{ 'on' if p == '/' }}">Overview</a>
    <a href="/transactions" class="{{ 'on' if p.startswith('/transactions') }}">Transactions</a>
    <a href="/budgets" class="{{ 'on' if p.startswith('/budgets') }}">Budgets</a>
    <a href="/reports" class="{{ 'on' if p.startswith('/reports') }}">Reports</a>
    <a href="/import" class="{{ 'on' if p.startswith('/import') }}">Import</a>
    <a href="/rules" class="{{ 'on' if p.startswith('/rules') }}">Rules</a>
    <a href="/categories" class="{{ 'on' if p.startswith('/categories') }}">Categories</a>
    <a href="/accounts" class="{{ 'on' if p.startswith('/accounts') }}">Accounts</a>
  </nav>
  <span class="local" title="Bound to 127.0.0.1 — nothing leaves this computer">● local only</span>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
